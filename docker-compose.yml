services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code-camp-slider-2025
    ports:
      - "3000:80"
    environment:
      PORT: "80"
      DATA_DIR: /app/data
    volumes:
      - codecamp-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  codecamp-data:
