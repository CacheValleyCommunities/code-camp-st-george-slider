<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Create admin · CodeCamp Control</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="auth-body">
    <main class="auth-card">
        <div class="brand">CodeCamp 2025</div>
        <h1>Create the admin account</h1>
        <p>This page is only available while the dashboard has no users. The first account becomes the admin and can add everyone else.</p>
        {{if .Error}}<div class="banner bad">{{.Error}}</div>{{end}}
        <form method="post" action="/setup">
            <input type="hidden" name="csrf" value="{{.CSRF}}">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
            </div>
            <button class="button" type="submit">Create admin and continue</button>
        </form>
    </main>
</body>
</html>
